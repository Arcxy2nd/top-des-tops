name: Deploy to Google Apps Script

# Depuis la bascule Vercel (Plan 6, 2026-09-21), les deux instances sont servies
# par Vercel : ce workflow ne se déclenche plus à chaque push (il repointait les
# liens courts vers Apps Script, ce qui annulait la bascule) et ne touche plus
# aux liens courts. Il reste lançable à la main pour tenir le chemin de retour
# arrière GAS à jour ; les liens se gèrent via repoint-shortlinks.yml.
on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Restore clasp credentials
        run: echo '${{ secrets.CLASPRC_JSON }}' > ~/.clasprc.json

      - name: Strip comments from the deployable files
        env:
          CI: true
        run: node .github/scripts/strip-comments.js

      - name: Verify the stripped code
        run: npm run verify

      - name: Push and redeploy all targets
        env:
          CI: true
          SHORTIO_API_KEY: ${{ secrets.SHORTIO_API_KEY }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: bash .github/scripts/deploy-gas.sh
